name: Refresh Naver content and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # GitHub Actions cron uses UTC. 15:23 UTC = 00:23 Asia/Seoul.
    - cron: '23 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh latest Naver Place photo and blog posts
        run: npm run update:content
      - name: Validate site
        run: npm run build
      - name: Persist refreshed content for the connected Pages site
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/data/place-photo.json public/data/blog-posts.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Naver content"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
