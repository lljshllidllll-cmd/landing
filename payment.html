<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="1986피트니스 중산점 비대면 결제상품과 이용 기간별 가격 안내" />
    <title>비대면 결제상품 | 1986피트니스 중산점</title>
    <link rel="canonical" href="https://1986fitness-jungsan.pages.dev/payment.html" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="payment-page">
    <main class="payment-shell">
      <div class="payment-header">
        <span>1986 FITNESS · JUNGSAN</span>
        <a href="./#faq">← Q&A로 돌아가기</a>
      </div>
      <p class="payment-kicker">MEMBERSHIP &amp; PT</p>
      <h1>비대면 결제상품 보기</h1>
      <p class="payment-intro">이용 기간과 PT 상품을 확인해보세요.</p>
      <fieldset class="faq-payment-options">
        <legend class="sr-only">비대면 결제상품 선택</legend>
        <div class="faq-payment-option-row">
          <label><input type="radio" name="payment-period" value="1-month" checked /><span class="faq-payment-card"><span>1개월 + 3일</span><strong>88,000원</strong></span></label>
          <label><input type="radio" name="payment-period" value="3-months" /><span class="faq-payment-card"><span>3개월 + 5일</span><strong>198,600원</strong></span></label>
          <label><input type="radio" name="payment-period" value="6-months" /><span class="faq-payment-card"><span>6개월 + 5일</span><strong>264,000원</strong></span></label>
          <label><input type="radio" name="payment-period" value="12-months" /><span class="faq-payment-card"><span>12개월 + 7일</span><strong>299,000원</strong></span></label>
        </div>
        <div class="faq-payment-option-row faq-payment-bundles">
          <label><input type="radio" name="payment-period" value="3-months-pt-10" /><span class="faq-payment-card"><span>회원권 3개월 + PT 10회</span><strong>399,000원</strong></span></label>
          <label><input type="radio" name="payment-period" value="12-months-pt-10" /><span class="faq-payment-card"><span>회원권 12개월 + PT 10회</span><strong>599,000원</strong></span></label>
          <label><input type="radio" name="payment-period" value="monthly-promotion" /><span class="faq-payment-card"><span>이달의 프로모션 상품</span></span></label>
        </div>
      </fieldset>
      <p class="payment-note">결제 링크는 준비 중입니다.</p>
      <a class="payment-home" href="./">홈으로 돌아가기 <span aria-hidden="true">↗</span></a>
    </main>
  </body>
</html>
